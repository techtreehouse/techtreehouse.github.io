<script src="{{site.baseurl}}/assets/js/lunr.js"></script>

<form class="bd-search site-search-form" id="lunrsearchform">
    <label class="sr-only" for="lunrsearch">Search articles</label>
    <span class="site-search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.5-3.5"></path>
        </svg>
    </span>
    <input type="text" class="form-control text-small launch-modal-search" id="lunrsearch" name="q" maxlength="255" value="" placeholder="Search tutorials, topics, and posts..." autocomplete="off"/>
</form>

<div id="lunrsearchresults" class="lunr-search-shell" hidden>
    <div id="lunrsearch-backdrop" class="lunr-search-backdrop"></div>
    <div id="lunrsearch-panel" class="lunr-search-panel" role="dialog" aria-modal="true" aria-labelledby="lunrsearch-title">
        <div class="lunr-search-header">
            <div>
                <p class="lunr-search-kicker">Site Search</p>
                <h3 id="lunrsearch-title">Search the site</h3>
                <p id="lunrsearch-count" class="lunr-search-count"></p>
            </div>
            <button type="button" id="lunrsearch-close" class="lunr-search-close" aria-label="Close search">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="lunr-search-body">
            <div id="lunrsearch-empty" class="lunr-search-empty">
                <strong>Start typing to search Tech Treehouse.</strong>
                <span>Find tutorials, tips, and older posts quickly.</span>
            </div>
            <ul id="lunrsearch-list" class="lunr-search-list"></ul>
        </div>
    </div>
</div>

<script src="{{site.baseurl}}/assets/js/lunrsearchengine.js"></script>
